<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apollo Lunar Lander</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    overflow: hidden;
  }
  #game {
    background: #000;
    display: block;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

// ---------------------------------------------------------------------------
// Tunables
// ---------------------------------------------------------------------------
const GRAVITY        = 22;    // px/s^2 (lunar-ish, scaled)
const THRUST_ACCEL   = 58;    // px/s^2 when engine on
const ROT_SPEED      = 1.8;   // rad/s
const FUEL_MAX       = 100;
const FUEL_BURN      = 12;    // units/s while engine on
const PAD_WIDTH      = 110;   // arcade: flat landing zone width (round 1)
const PAD_WIDTH_MIN  = 44;    // arcade: pad never shrinks below this
const FUEL_MIN       = 45;    // arcade: starting fuel never drops below this
const MAX_VY_LAND    = 28;    // max safe vertical speed (px/s)
const MAX_VX_LAND    = 16;    // max safe horizontal speed (px/s)
const MAX_TILT_LAND  = 0.15;  // max safe tilt at touchdown (rad, ~8.6 deg)
const LANDER_SIZE    = 14;    // half-width of the lander body
const ADV_FUEL_MAX   = 180;   // adventure: bigger tank (+80%) — pads can be far apart
const ADV_PAD_WIDTH  = 90;    // adventure: landing pad width
const ADV_PAD_BONUS  = 150;   // adventure: points per new pad reached
const ADV_SKIP_BONUS = 200;   // adventure: extra points per pad flown past without landing
const ADV_CAVE_GAP_MIN = 95;  // adventure: tightest tunnel passage far into the journey

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
const keys = {};
addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === "t" || e.key === "T") showTrajectory = !showTrajectory;
  if ((e.key === "p" || e.key === "P") && state === "flying") paused = !paused;
  if (state === "menu") {
    if (e.key === "1") { mode = "arcade"; round = 1; score = 0; startRound(); }
    if (e.key === "2") { mode = "adventure"; advStart(); }
    return;
  }
  if (state !== "flying") {
    if (e.key === "m" || e.key === "M") { state = "menu"; return; }
    if (e.key === " " || e.key === "r" || e.key === "R") {
      if (mode === "arcade") {
        if (state === "landed") round++;
        else { round = 1; score = 0; }
        startRound();
      } else {
        advStart();
      }
    }
  }
});
addEventListener("keyup", e => { keys[e.key] = false; });

// ---------------------------------------------------------------------------
// Shared state
// ---------------------------------------------------------------------------
let mode = "arcade";          // "arcade" | "adventure"
let state = "menu";           // "menu" | "flying" | "landed" | "crashed"
let stars = [];
let lander, particles = [], debris = [], message = "", elapsed = 0;
let banner = "", bannerT = 0;
let showTrajectory = false;   // 't' toggles the no-thrust trajectory helper
let paused = false;           // 'p' toggles pause during flight

// Arcade world
let terrain = [];             // list of {x, y} points, left to right
let padX0, padX1, padY;
let round = 1, score = 0, roundPoints = 0;
let padWidth = PAD_WIDTH, fuelMax = FUEL_MAX;

// Adventure world
let adv = null;

function makeStars() {
  stars = Array.from({ length: 90 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H * 0.7,
    r: Math.random() * 1.4 + 0.3
  }));
}

// Linear interpolation along a polyline of {x, y} points
function interpY(points, x) {
  if (!points || points.length === 0) return 1e9;
  if (x <= points[0].x) return points[0].y;
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    if (x >= a.x && x <= b.x) {
      return a.y + (b.y - a.y) * ((x - a.x) / ((b.x - a.x) || 1));
    }
  }
  return points[points.length - 1].y;
}

function groundYAt(x) {
  return mode === "adventure" ? interpY(adv.floor, x) : interpY(terrain, x);
}
function ceilYAt(x) {
  return mode === "adventure" ? interpY(adv.ceil, x) : -1e9;
}

// ---------------------------------------------------------------------------
// Arcade world
// ---------------------------------------------------------------------------

// Each round: taller mountains, narrower pad, less starting fuel
function applyDifficulty() {
  padWidth = Math.max(PAD_WIDTH_MIN, PAD_WIDTH - (round - 1) * 9);
  fuelMax = Math.max(FUEL_MIN, FUEL_MAX - (round - 1) * 7);
}

function generateTerrain() {
  terrain = [];
  const roughness = Math.min(130, 70 + (round - 1) * 14);        // step-to-step jaggedness
  const peakCeiling = Math.max(H * 0.18, H * 0.45 - (round - 1) * 0.035 * H); // how high peaks may reach
  // Pick where the flat pad goes (avoid extreme edges)
  const padStart = 100 + Math.random() * (W - 200 - padWidth);
  padX0 = padStart;
  padX1 = padStart + padWidth;
  padY = H - 80 - Math.random() * 60;

  let x = 0;
  let y = H - 60 - Math.random() * 120;
  terrain.push({ x, y });
  while (x < W) {
    const step = 20 + Math.random() * 25;
    if (x < padX0 && x + step >= padX0) {
      // Enter the pad: flat segment
      terrain.push({ x: padX0, y: padY });
      terrain.push({ x: padX1, y: padY });
      x = padX1;
      y = padY;
      continue;
    }
    x += step;
    y += (Math.random() - 0.5) * roughness;
    // Higher rounds throw in sharp peaks reaching toward the ceiling
    if (Math.random() < Math.min(0.22, (round - 1) * 0.03)) {
      y = peakCeiling + Math.random() * 80;
    }
    y = Math.max(peakCeiling, Math.min(H - 40, y));
    terrain.push({ x: Math.min(x, W), y });
  }
}

function startRound() {
  applyDifficulty();
  generateTerrain();
  makeStars();
  lander = {
    x: 80 + Math.random() * (W - 160),
    y: 70,
    vx: (Math.random() * 2 - 1) * 25,
    vy: 10,
    angle: 0,          // 0 = upright, positive = clockwise
    fuel: fuelMax,
    thrusting: false,
    onGround: false
  };
  particles = [];
  debris = [];
  message = "";
  banner = ""; bannerT = 0;
  roundPoints = 0;
  elapsed = 0;
  paused = false;
  state = "flying";
}

// ---------------------------------------------------------------------------
// Adventure world — endless terrain scrolling right, pads refuel, caves
// ---------------------------------------------------------------------------
function advStart() {
  score = 0;
  adv = {
    floor: [{ x: -700, y: 500 }],
    ceil:  [{ x: -700, y: -700 }],
    pads: [],
    nextPadX: 160,
    padCount: 0,
    padsLanded: 0,
    lastPadId: 1,   // id of the pad the ship last rested on (the start pad)
    inCave: false,
    caveEnd: 0,
    caveGap: 0,
    ceilY: -700,
    startX: 0
  };
  ensureWorld(W * 2);
  const p = adv.pads[0];
  p.visited = true; // no points for the pad you start on
  adv.startX = (p.x0 + p.x1) / 2;
  lander = {
    x: adv.startX,
    y: p.y - LANDER_SIZE - 4,
    vx: 0, vy: 0,
    angle: 0,
    fuel: ADV_FUEL_MAX,
    thrusting: false,
    onGround: true
  };
  makeStars();
  particles = [];
  debris = [];
  message = "";
  banner = "LIFT OFF WHEN READY — HEAD RIGHT →"; bannerT = 4;
  elapsed = 0;
  paused = false;
  state = "flying";
}

function ensureWorld(upToX) {
  let last = adv.floor[adv.floor.length - 1];
  while (last.x < upToX) {
    let x = last.x, y = last.y;

    if (x >= adv.nextPadX) {
      // Flat landing pad (keeps the current ceiling, so pads can sit in caves)
      adv.floor.push({ x: x + ADV_PAD_WIDTH, y });
      adv.ceil.push({ x: x + ADV_PAD_WIDTH, y: adv.ceilY });
      adv.padCount++;
      adv.pads.push({ x0: x, x1: x + ADV_PAD_WIDTH, y, id: adv.padCount, visited: false });
      // Pads spread out as you progress
      adv.nextPadX = x + 900 + Math.random() * 600 + Math.min(1200, Math.max(0, x) * 0.04);
      last = adv.floor[adv.floor.length - 1];
      continue;
    }

    const step = 20 + Math.random() * 25;
    x += step;
    // Ground gets less smooth with distance
    const roughness = 80 + Math.min(70, Math.max(0, x) / 500);
    y += (Math.random() - 0.5) * roughness;
    y = Math.max(180, Math.min(600, y));
    adv.floor.push({ x, y });

    // Cave sections: the rock ceiling descends to form a corridor
    if (!adv.inCave && x > 1400 && Math.random() < 0.02 + Math.min(0.045, x / 60000)) {
      adv.inCave = true;
      adv.caveEnd = x + 400 + Math.random() * 500;
      // Tunnels get tighter with distance
      const shrink = Math.min(60, x / 700);
      adv.caveGap = Math.max(ADV_CAVE_GAP_MIN, 150 + Math.random() * 60 - shrink);
    }
    if (adv.inCave && x > adv.caveEnd) adv.inCave = false;
    const targetCeil = adv.inCave ? y - adv.caveGap : -700;
    const delta = Math.max(-70, Math.min(70, targetCeil - adv.ceilY));
    adv.ceilY = Math.min(adv.ceilY + delta, y - ADV_CAVE_GAP_MIN); // never pinch the passage shut
    adv.ceil.push({ x, y: adv.ceilY });

    last = adv.floor[adv.floor.length - 1];
  }
}

function pruneWorld() {
  const cut = lander.x - W * 1.5;
  while (adv.floor.length > 2 && adv.floor[1].x < cut) adv.floor.shift();
  while (adv.ceil.length > 2 && adv.ceil[1].x < cut) adv.ceil.shift();
  while (adv.pads.length > 0 && adv.pads[0].x1 < cut) adv.pads.shift();
}

function landOnPad(pad) {
  lander.onGround = true;
  lander.vx = lander.vy = 0;
  lander.angle = 0;
  lander.y = pad.y - LANDER_SIZE - 4;
  lander.fuel = ADV_FUEL_MAX;
  if (!pad.visited) {
    pad.visited = true;
    adv.padsLanded++;
    const skipped = Math.max(0, pad.id - adv.lastPadId - 1);
    score += ADV_PAD_BONUS + skipped * ADV_SKIP_BONUS;
    banner = `PAD ${pad.id} — REFUELED  +${ADV_PAD_BONUS}`;
    if (skipped > 0) {
      banner += `   SKIPPED ${skipped} PAD${skipped > 1 ? "S" : ""}  +${skipped * ADV_SKIP_BONUS}`;
    }
  } else {
    banner = "REFUELED";
  }
  adv.lastPadId = Math.max(adv.lastPadId, pad.id);
  bannerT = 2.5;
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function update(dt) {
  if (paused) return;
  elapsed += dt;
  if (bannerT > 0) bannerT -= dt;

  if (state === "flying") {
    if (mode === "adventure") {
      ensureWorld(lander.x + W * 1.5);
      pruneWorld();
    }

    if (lander.onGround) {
      // Resting on a pad: wait for the engine to lift off again
      lander.thrusting = false;
      if (keys["ArrowUp"] && lander.fuel > 0) {
        lander.onGround = false;
        lander.vy = -30;
      }
    } else {
      if (keys["ArrowLeft"])  lander.angle -= ROT_SPEED * dt;
      if (keys["ArrowRight"]) lander.angle += ROT_SPEED * dt;

      lander.thrusting = !!keys["ArrowUp"] && lander.fuel > 0;
      if (lander.thrusting) {
        lander.vx += Math.sin(lander.angle) * THRUST_ACCEL * dt;
        lander.vy -= Math.cos(lander.angle) * THRUST_ACCEL * dt;
        lander.fuel = Math.max(0, lander.fuel - FUEL_BURN * dt);
        spawnExhaust();
      }

      lander.vy += GRAVITY * dt;
      lander.x += lander.vx * dt;
      lander.y += lander.vy * dt;

      if (mode === "arcade") {
        // Wrap horizontally so the ship never leaves the screen
        if (lander.x < 0) lander.x += W;
        if (lander.x > W) lander.x -= W;
        checkContact();
      } else {
        // The world only extends rightward
        const leftEdge = adv.floor[0].x + 40;
        if (lander.x < leftEdge) {
          lander.x = leftEdge;
          if (lander.vx < 0) lander.vx = 0;
        }
        advCheckContact();
      }
    }
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const d of debris) {
    d.vy += GRAVITY * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.rot += d.vr * dt;
    if (d.y > groundYAt(d.x) - 2) { d.vy *= -0.35; d.vx *= 0.7; d.y = groundYAt(d.x) - 2; }
  }
}

function spawnExhaust() {
  for (let i = 0; i < 3; i++) {
    const spread = (Math.random() - 0.5) * 0.5;
    const a = lander.angle + Math.PI + spread; // opposite of nose
    const speed = 120 + Math.random() * 60;
    particles.push({
      x: lander.x - Math.sin(lander.angle) * LANDER_SIZE,
      y: lander.y + Math.cos(lander.angle) * LANDER_SIZE,
      vx: Math.sin(a) * speed + lander.vx,
      vy: -Math.cos(a) * speed + lander.vy,
      life: 0.25 + Math.random() * 0.2,
      color: Math.random() < 0.5 ? "#ffb347" : "#ffe26a"
    });
  }
}

function landerPoint(dx, dy) {
  const cos = Math.cos(lander.angle), sin = Math.sin(lander.angle);
  return { x: lander.x + dx * cos - dy * sin, y: lander.y + dx * sin + dy * cos };
}

function legsTouchFloor(floorPoints) {
  for (const [dx, dy] of [[-LANDER_SIZE, LANDER_SIZE + 4], [LANDER_SIZE, LANDER_SIZE + 4]]) {
    const p = landerPoint(dx, dy);
    if (p.y >= interpY(floorPoints, p.x)) return true;
  }
  return false;
}

function checkContact() {
  if (!legsTouchFloor(terrain)) return;

  const onPad = lander.x - LANDER_SIZE * 0.8 >= padX0 && lander.x + LANDER_SIZE * 0.8 <= padX1;
  const tilt = Math.abs(normalizeAngle(lander.angle));
  const softV = Math.abs(lander.vy) <= MAX_VY_LAND;
  const softH = Math.abs(lander.vx) <= MAX_VX_LAND;

  if (onPad && softV && softH && tilt <= MAX_TILT_LAND) {
    state = "landed";
    message = "THE EAGLE HAS LANDED!";
    roundPoints = 100 * round + Math.round(lander.fuel);
    score += roundPoints;
    lander.vx = lander.vy = 0;
    lander.angle = 0;
    lander.y = padY - LANDER_SIZE - 4;
  } else {
    state = "crashed";
    if (!onPad)            message = "CRASHED — MISSED THE LANDING ZONE";
    else if (!softV)       message = "CRASHED — DESCENT TOO FAST";
    else if (!softH)       message = "CRASHED — DRIFTING TOO FAST";
    else                   message = "CRASHED — TOO MUCH TILT";
    explode();
  }
}

function advCheckContact() {
  // Cave roof: touching it at any speed is fatal
  for (const [dx, dy] of [[0, -16], [-9, -9], [9, -9]]) {
    const p = landerPoint(dx, dy);
    if (p.y <= interpY(adv.ceil, p.x)) {
      state = "crashed";
      message = "CRASHED — HIT THE CAVE ROOF";
      explode();
      return;
    }
  }

  if (!legsTouchFloor(adv.floor)) return;

  const pad = adv.pads.find(p =>
    lander.x - LANDER_SIZE * 0.8 >= p.x0 && lander.x + LANDER_SIZE * 0.8 <= p.x1);
  const tilt = Math.abs(normalizeAngle(lander.angle));
  const softV = lander.vy >= 0 && lander.vy <= MAX_VY_LAND;
  const softH = Math.abs(lander.vx) <= MAX_VX_LAND;

  if (pad && softV && softH && tilt <= MAX_TILT_LAND) {
    landOnPad(pad);
  } else {
    state = "crashed";
    if (!pad)         message = "CRASHED — NOT A LANDING PAD";
    else if (!softV)  message = "CRASHED — DESCENT TOO FAST";
    else if (!softH)  message = "CRASHED — DRIFTING TOO FAST";
    else              message = "CRASHED — TOO MUCH TILT";
    explode();
  }
}

function normalizeAngle(a) {
  while (a > Math.PI) a -= 2 * Math.PI;
  while (a < -Math.PI) a += 2 * Math.PI;
  return a;
}

function explode() {
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 140;
    particles.push({
      x: lander.x, y: lander.y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
      life: 0.5 + Math.random() * 0.8,
      color: ["#ffb347", "#ff6b35", "#ffe26a", "#ccc"][i % 4]
    });
  }
  for (let i = 0; i < 8; i++) {
    debris.push({
      x: lander.x, y: lander.y,
      vx: (Math.random() - 0.5) * 160,
      vy: -Math.random() * 120,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 8,
      size: 3 + Math.random() * 5
    });
  }
}

// ---------------------------------------------------------------------------
// Draw
// ---------------------------------------------------------------------------
function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  let camX = 0, camY = 0;
  if (mode === "adventure" && lander && state !== "menu") {
    camX = lander.x - W * 0.5;
    camY = Math.min(90, lander.y - H * 0.55);
  }

  // Stars (slight parallax in adventure)
  ctx.fillStyle = "#fff";
  for (const s of stars) {
    const sx = ((s.x - camX * 0.15) % W + W) % W;
    const sy = ((s.y - camY * 0.15) % (H * 0.7) + H * 0.7) % (H * 0.7);
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(elapsed * 0.7 + s.x));
    ctx.fillRect(sx, sy, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  // Earth in the distance
  ctx.save();
  ctx.beginPath();
  ctx.arc(W - 120, 90, 26, 0, Math.PI * 2);
  ctx.fillStyle = "#2b6cb0";
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = "#3c9d5d";
  ctx.beginPath(); ctx.ellipse(W - 130, 82, 12, 8, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W - 108, 100, 9, 6, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (state === "menu") { drawMenu(); return; }

  ctx.save();
  ctx.translate(-camX, -camY);
  if (mode === "arcade") {
    drawTerrain();
    drawPad(padX0, padX1, padY, false, "LANDING ZONE");
  } else {
    drawAdvTerrain(camX, camY);
    for (const p of adv.pads) {
      if (p.x1 < camX - 60 || p.x0 > camX + W + 60) continue;
      drawPad(p.x0, p.x1, p.y, p.visited, `PAD ${p.id}`);
    }
  }
  drawParticles();
  drawDebris();
  drawTrajectory();
  if (state !== "crashed") drawLander();
  ctx.restore();

  drawHUD();
  drawBanner();
  if (state !== "flying") drawEndScreen();
  if (paused) drawPauseScreen();
}

function drawPauseScreen() {
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, H / 2 - 70, W, 120);
  ctx.textAlign = "center";
  ctx.font = "bold 30px Courier New";
  ctx.fillStyle = "#ffd166";
  ctx.fillText("PAUSED", W / 2, H / 2 - 20);
  ctx.font = "16px Courier New";
  ctx.fillStyle = "#aaa";
  ctx.fillText("Press P to resume", W / 2, H / 2 + 10);
}

function drawMenu() {
  ctx.textAlign = "center";
  ctx.font = "bold 42px Courier New";
  ctx.fillStyle = "#e8e8f0";
  ctx.fillText("APOLLO LUNAR LANDER", W / 2, H * 0.32);

  ctx.font = "18px Courier New";
  ctx.fillStyle = "#9adf9a";
  ctx.fillText("1 — ARCADE", W / 2, H * 0.48);
  ctx.fillStyle = "#888";
  ctx.fillText("land on the pad, each round gets harder", W / 2, H * 0.52);

  ctx.fillStyle = "#9adf9a";
  ctx.fillText("2 — ADVENTURE", W / 2, H * 0.62);
  ctx.fillStyle = "#888";
  ctx.fillText("journey right from pad to pad, refuel at each — beware the caves", W / 2, H * 0.66);

  ctx.fillStyle = "#666";
  ctx.font = "14px Courier New";
  ctx.fillText("← → rotate    ↑ thrust    T trajectory helper    P pause", W / 2, H * 0.8);
}

function drawTerrain() {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (const p of terrain) ctx.lineTo(p.x, p.y);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = "#2a2a2e";
  ctx.fill();
  ctx.beginPath();
  for (let i = 0; i < terrain.length; i++) {
    const p = terrain[i];
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = "#8a8a92";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawAdvTerrain(camX, camY) {
  const bottom = camY + H + 80;
  const top = camY - 80;

  // Floor
  ctx.beginPath();
  ctx.moveTo(adv.floor[0].x, bottom);
  for (const p of adv.floor) ctx.lineTo(p.x, p.y);
  ctx.lineTo(adv.floor[adv.floor.length - 1].x, bottom);
  ctx.closePath();
  ctx.fillStyle = "#2a2a2e";
  ctx.fill();
  ctx.beginPath();
  for (let i = 0; i < adv.floor.length; i++) {
    const p = adv.floor[i];
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = "#8a8a92";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Cave ceiling (hangs from above; far offscreen outside caves)
  ctx.beginPath();
  ctx.moveTo(adv.ceil[0].x, top);
  for (const p of adv.ceil) ctx.lineTo(p.x, p.y);
  ctx.lineTo(adv.ceil[adv.ceil.length - 1].x, top);
  ctx.closePath();
  ctx.fillStyle = "#26262b";
  ctx.fill();
  ctx.beginPath();
  for (let i = 0; i < adv.ceil.length; i++) {
    const p = adv.ceil[i];
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = "#77777f";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawPad(x0, x1, y, visited, label) {
  const w = x1 - x0;
  ctx.fillStyle = visited ? "#2e5d2e" : "#4caf50";
  ctx.fillRect(x0, y - 3, w, 5);
  // Blinking beacon lights (steady dim when already visited)
  const on = visited ? false : Math.sin(elapsed * 6) > 0;
  ctx.fillStyle = on ? "#7CFC00" : "#2e5d2e";
  for (const bx of [x0 + 6, x1 - 6]) {
    ctx.beginPath();
    ctx.arc(bx, y - 8, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(bx - 1, y - 6, 2, 6);
  }
  ctx.fillStyle = visited ? "#2e5d2e" : "#4caf50";
  ctx.font = "10px Courier New";
  ctx.textAlign = "center";
  ctx.fillText(label, (x0 + x1) / 2, y + 16);
}

// Dashed preview of the coasting (no-thrust) path, with an X at the
// predicted impact — green if the impact speeds would be survivable
function drawTrajectory() {
  if (!showTrajectory || state !== "flying" || lander.onGround) return;
  const floorPts = mode === "adventure" ? adv.floor : terrain;
  let px = lander.x, py = lander.y, vx = lander.vx, vy = lander.vy;
  const dt = 1 / 60;
  let impact = null, safe = false;

  ctx.beginPath();
  ctx.moveTo(px, py);
  for (let i = 0; i < 8 * 60; i++) {
    vy += GRAVITY * dt;
    px += vx * dt;
    py += vy * dt;
    if (mode === "arcade") {
      // Follow the ship's horizontal wrap; break the stroke at the seam
      if (px < 0)      { px += W; ctx.moveTo(px, py); }
      else if (px > W) { px -= W; ctx.moveTo(px, py); }
    }
    if (i % 3 === 0) ctx.lineTo(px, py);
    if (mode === "adventure" && py <= interpY(adv.ceil, px) + 16) {
      impact = { x: px, y: py };
      safe = false; // hitting the cave roof is always fatal
      break;
    }
    if (py >= interpY(floorPts, px) - (LANDER_SIZE + 4)) {
      impact = { x: px, y: py };
      safe = Math.abs(vy) <= MAX_VY_LAND && Math.abs(vx) <= MAX_VX_LAND;
      break;
    }
  }
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = "rgba(102, 217, 255, 0.7)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.setLineDash([]);

  if (impact) {
    ctx.strokeStyle = safe ? "#7CFC00" : "#ff6b6b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(impact.x - 6, impact.y - 6); ctx.lineTo(impact.x + 6, impact.y + 6);
    ctx.moveTo(impact.x - 6, impact.y + 6); ctx.lineTo(impact.x + 6, impact.y - 6);
    ctx.stroke();
  }
}

function drawLander() {
  ctx.save();
  ctx.translate(lander.x, lander.y);
  ctx.rotate(lander.angle);

  // Flame
  if (lander.thrusting && state === "flying") {
    const flick = 8 + Math.random() * 10;
    ctx.beginPath();
    ctx.moveTo(-5, LANDER_SIZE);
    ctx.lineTo(0, LANDER_SIZE + flick + 8);
    ctx.lineTo(5, LANDER_SIZE);
    ctx.closePath();
    ctx.fillStyle = "#ff9d33";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-3, LANDER_SIZE);
    ctx.lineTo(0, LANDER_SIZE + flick);
    ctx.lineTo(3, LANDER_SIZE);
    ctx.closePath();
    ctx.fillStyle = "#ffe26a";
    ctx.fill();
  }

  // Descent stage (gold)
  ctx.fillStyle = "#c9a227";
  ctx.fillRect(-LANDER_SIZE, 0, LANDER_SIZE * 2, 10);
  ctx.strokeStyle = "#8f7118";
  ctx.strokeRect(-LANDER_SIZE, 0, LANDER_SIZE * 2, 10);

  // Ascent stage (grey octagon-ish)
  ctx.beginPath();
  ctx.moveTo(-9, 0);
  ctx.lineTo(-9, -8);
  ctx.lineTo(-4, -14);
  ctx.lineTo(4, -14);
  ctx.lineTo(9, -8);
  ctx.lineTo(9, 0);
  ctx.closePath();
  ctx.fillStyle = "#b8b8c0";
  ctx.fill();
  ctx.strokeStyle = "#6f6f78";
  ctx.stroke();

  // Window
  ctx.fillStyle = "#20324a";
  ctx.fillRect(-6, -11, 5, 5);

  // Legs
  ctx.strokeStyle = "#999";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-9, 8);  ctx.lineTo(-LANDER_SIZE, LANDER_SIZE + 4);
  ctx.moveTo(9, 8);   ctx.lineTo(LANDER_SIZE, LANDER_SIZE + 4);
  ctx.stroke();
  // Foot pads
  ctx.fillStyle = "#999";
  ctx.fillRect(-LANDER_SIZE - 3, LANDER_SIZE + 3, 7, 2);
  ctx.fillRect(LANDER_SIZE - 4, LANDER_SIZE + 3, 7, 2);

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 3);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function drawDebris() {
  ctx.fillStyle = "#9a9aa2";
  for (const d of debris) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.fillRect(-d.size / 2, -d.size / 2, d.size, d.size);
    ctx.restore();
  }
}

function drawHUD() {
  if (!lander) return;
  const altitude = Math.max(0, groundYAt(lander.x) - lander.y - LANDER_SIZE - 4);
  const vxOK = Math.abs(lander.vx) <= MAX_VX_LAND;
  const vyOK = Math.abs(lander.vy) <= MAX_VY_LAND;

  ctx.font = "14px Courier New";
  ctx.textAlign = "left";
  ctx.fillStyle = "#9adf9a";
  ctx.fillText(`ALTITUDE   ${altitude.toFixed(0).padStart(5)}`, 16, 26);
  ctx.fillStyle = vyOK ? "#9adf9a" : "#ff6b6b";
  ctx.fillText(`V-SPEED    ${lander.vy.toFixed(0).padStart(5)}`, 16, 44);
  ctx.fillStyle = vxOK ? "#9adf9a" : "#ff6b6b";
  ctx.fillText(`H-SPEED    ${lander.vx.toFixed(0).padStart(5)}`, 16, 62);
  const deg = normalizeAngle(lander.angle) * 180 / Math.PI;
  ctx.fillStyle = Math.abs(deg) <= MAX_TILT_LAND * 180 / Math.PI ? "#9adf9a" : "#ffd166";
  ctx.fillText(`TILT       ${deg.toFixed(0).padStart(5)}°`, 16, 80);

  // Fuel bar
  const cap = mode === "adventure" ? ADV_FUEL_MAX : fuelMax;
  ctx.fillStyle = "#9adf9a";
  ctx.fillText("FUEL", 16, 102);
  ctx.strokeStyle = "#9adf9a";
  ctx.strokeRect(70, 91, 140, 12);
  const fFrac = lander.fuel / cap;
  ctx.fillStyle = fFrac > 0.3 ? "#4caf50" : "#ff6b6b";
  ctx.fillRect(72, 93, 136 * fFrac, 8);
  if (lander.fuel <= 0 && state === "flying" && !lander.onGround) {
    ctx.fillStyle = Math.sin(elapsed * 8) > 0 ? "#ff6b6b" : "#802020";
    ctx.fillText("OUT OF FUEL", 220, 102);
  }

  // Mode-specific readouts
  ctx.textAlign = "right";
  ctx.fillStyle = "#9adf9a";
  if (mode === "arcade") {
    ctx.fillText(`ROUND ${round}`, W - 16, 48);
    ctx.fillText(`SCORE ${score}`, W - 16, 66);
  } else {
    ctx.fillText(`SCORE ${score}`, W - 16, 48);
    ctx.fillText(`PADS  ${adv.padsLanded}`, W - 16, 66);
    ctx.fillText(`DIST  ${advDistance()} m`, W - 16, 84);
  }

  // Controls hint
  ctx.fillStyle = "#666";
  ctx.fillText(`← → rotate   ↑ thrust   T trajectory ${showTrajectory ? "ON" : "off"}`, W - 16, 26);
}

function advDistance() {
  return Math.max(0, Math.round((lander.x - adv.startX) / 10));
}

function drawBanner() {
  if (bannerT <= 0) return;
  ctx.textAlign = "center";
  ctx.font = "bold 18px Courier New";
  ctx.globalAlpha = Math.min(1, bannerT);
  ctx.fillStyle = "#7CFC00";
  ctx.fillText(banner, W / 2, 60);
  ctx.globalAlpha = 1;
}

function drawEndScreen() {
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, H / 2 - 70, W, 120);
  ctx.textAlign = "center";
  ctx.font = "bold 30px Courier New";
  ctx.fillStyle = state === "landed" ? "#7CFC00" : "#ff6b6b";
  ctx.fillText(message, W / 2, H / 2 - 20);
  ctx.font = "16px Courier New";
  if (mode === "arcade") {
    if (state === "landed") {
      ctx.fillStyle = "#ccc";
      ctx.fillText(`+${roundPoints} points (fuel bonus ${Math.round(lander.fuel)})   TOTAL ${score}`, W / 2, H / 2 + 8);
      ctx.fillStyle = "#aaa";
      ctx.fillText(`Press SPACE for round ${round + 1} — smaller pad, less fuel, higher peaks`, W / 2, H / 2 + 34);
    } else {
      ctx.fillStyle = "#ccc";
      ctx.fillText(`FINAL SCORE ${score} — reached round ${round}`, W / 2, H / 2 + 8);
      ctx.fillStyle = "#aaa";
      ctx.fillText("SPACE to start over — M for menu", W / 2, H / 2 + 34);
    }
  } else {
    ctx.fillStyle = "#ccc";
    ctx.fillText(`FINAL SCORE ${score} — ${adv.padsLanded} pads, ${advDistance()} m travelled`, W / 2, H / 2 + 8);
    ctx.fillStyle = "#aaa";
    ctx.fillText("SPACE to retry — M for menu", W / 2, H / 2 + 34);
  }
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

makeStars();
requestAnimationFrame(frame);
</script>
</body>
</html>
